<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2026 — Liza's Calendar</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #f0fdf4 0%, #f0f9ff 50%, #faf5ff 100%);
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --accent-primary: #3b82f6;
            --accent-glow: rgba(59, 130, 246, 0.15);
            --border-color: #f1f5f9;
            
            /* Светлые свежие цвета пакетов */
            --p1-bg: #dcfce7; --p1-color: #15803d;
            --p2-bg: #e0f2fe; --p2-color: #0369a1;
            --p3-bg: #ffedd5; --p3-color: #c2410c;
            --p4-bg: #f3e8ff; --p4-color: #7e22ce;
            --p5-bg: #ffe4e6; --p5-color: #be123c;
            --p6-bg: #dbeafe; --p6-color: #1d4ed8;
            --p7-bg: #ccfbf1; --p7-color: #0f766e;
            --p8-bg: #ffedd5; --p8-color: #9a3412;
            --p9-bg: #fce7f3; --p9-color: #9d174d;
            --p10-bg: #e2e8f0; --p10-color: #334155; /* Новый Пакет 10 — нейтральный серо-синий */
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
        }

        body {
            background: var(--bg-gradient);
            background-attachment: fixed;
            color: var(--text-main);
            min-height: 100vh;
            padding: 30px 15px 40px;
        }

        .container {
            max-width: 1440px;
            margin: 0 auto;
        }

        /* Шапка - светлая, минималистичная */
        header {
            text-align: center;
            margin-bottom: 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 12px;
        }

        .year-badge {
            display: inline-block;
            background: linear-gradient(135deg, #60a5fa 0%, #3b82f6 100%);
            color: white;
            font-size: 1.05rem;
            font-weight: 800;
            padding: 6px 22px;
            border-radius: 9999px;
            letter-spacing: 2px;
            box-shadow: 0 4px 15px rgba(59, 130, 246, 0.25);
        }

        h1 {
            color: #0f172a;
            font-size: 2.5rem;
            font-weight: 800;
            letter-spacing: -0.5px;
            margin: 0;
        }

        /* Сетка календаря */
        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 28px;
        }

        /* Карточка месяца - светлая и воздушная */
        .month-card {
            background: var(--card-bg);
            border-radius: 20px;
            border: 1px solid #f1f5f9;
            box-shadow: 0 10px 30px -10px rgba(148, 163, 184, 0.12);
            overflow: hidden;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            flex-direction: column;
        }

        .month-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 20px 35px -10px rgba(59, 130, 246, 0.15);
            border-color: #e2e8f0;
        }

        /* Заголовок месяца - свежий нежно-голубой градиент */
        .month-title {
            background: linear-gradient(135deg, #f0f9ff 0%, #e0f2fe 100%);
            color: #0369a1;
            text-align: center;
            padding: 16px;
            font-size: 1.2rem;
            font-weight: 800;
            letter-spacing: 0.3px;
            border-bottom: 1px solid #bae6fd;
        }

        .calendar-table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 4px;
            padding: 14px;
        }

        .calendar-table th {
            padding: 8px 0;
            font-weight: 700;
            font-size: 0.8rem;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .calendar-table th.weekend-header {
            color: #f87171;
        }

        .calendar-table td {
            text-align: center;
            padding: 0;
            height: 38px;
            width: 38px;
            font-size: 0.9rem;
            font-weight: 600;
            border-radius: 10px;
            vertical-align: middle;
            transition: all 0.2s ease;
            position: relative;
        }

        /* Выходные */
        .weekend {
            background-color: #fff1f2;
            color: #f43f5e;
        }

        .other-month {
            color: #e2e8f0;
            font-weight: 400;
        }

        /* Пакеты */
        .p1 { background-color: var(--p1-bg); color: var(--p1-color); }
        .p2 { background-color: var(--p2-bg); color: var(--p2-color); }
        .p3 { background-color: var(--p3-bg); color: var(--p3-color); }
        .p4 { background-color: var(--p4-bg); color: var(--p4-color); }
        .p5 { background-color: var(--p5-bg); color: var(--p5-color); }
        .p6 { background-color: var(--p6-bg); color: var(--p6-color); }
        .p7 { background-color: var(--p7-bg); color: var(--p7-color); }
        .p8 { background-color: var(--p8-bg); color: var(--p8-color); }
        .p9 { background-color: var(--p9-bg); color: var(--p9-color); }
        .p10 { background-color: var(--p10-bg); color: var(--p10-color); }

        /* Занятия (Яркая синяя рамка и точка) */
        .lesson-badge {
            box-shadow: inset 0 0 0 2px #2563eb;
            position: relative;
            font-weight: 800 !important;
        }

        .lesson-badge::after {
            content: '';
            position: absolute;
            top: 4px;
            right: 4px;
            width: 6px;
            height: 6px;
            background-color: #2563eb;
            border-radius: 50%;
        }

        footer {
            text-align: center;
            margin-top: 50px;
            color: var(--text-muted);
            font-size: 0.85rem;
            font-weight: 500;
        }
    </style>
</head>
<body>
<div class="container">
    <header>
        <span class="year-badge">2026</span>
        <h1>Liza's Calendar</h1>
    </header>

    <div class="calendar-grid" id="calendarGrid"></div>

    <footer>
        <p>© 2026 Liza's Calendar</p>
    </footer>
</div>

<script>
    const year = 2026;
    const months = ["Январь","Февраль","Март","Апрель","Май","Июнь","Июль","Август","Сентябрь","Октябрь","Ноябрь","Декабрь"];
    const weekDays = ["Пн","Вт","Ср","Чт","Пт","Сб","Вс"];

    // ---------- ПАКЕТЫ ----------
    const pkg1 = [
        "2026-01-12","2026-01-13","2026-01-14","2026-01-15","2026-01-16",
        "2026-01-19","2026-01-20","2026-01-21","2026-01-22","2026-01-23",
        "2026-01-26","2026-01-27","2026-01-28","2026-01-29","2026-01-30",
        "2026-02-02","2026-02-03","2026-02-04","2026-02-05","2026-02-06"
    ];

    const pkg2 = [
        "2026-02-09","2026-02-10","2026-02-11","2026-02-12","2026-02-13",
        "2026-02-16","2026-02-17","2026-02-18","2026-02-19","2026-02-20",
        "2026-02-23","2026-02-24","2026-02-25","2026-02-26","2026-02-27",
        "2026-03-02","2026-03-03","2026-03-04","2026-03-05","2026-03-06"
    ];

    const pkg3 = [
        "2026-03-09","2026-03-10","2026-03-11","2026-03-12","2026-03-13",
        "2026-03-16","2026-03-17","2026-03-18","2026-03-19","2026-03-20",
        "2026-03-23","2026-03-24","2026-03-25","2026-03-26","2026-03-27",
        "2026-03-30","2026-03-31","2026-04-01","2026-04-02","2026-04-03"
    ];

    const pkg4 = [
        "2026-04-06","2026-04-07","2026-04-08","2026-04-09","2026-04-10",
        "2026-04-13","2026-04-14","2026-04-15","2026-04-16","2026-04-17",
        "2026-04-20","2026-04-21","2026-04-22","2026-04-23","2026-04-24",
        "2026-04-27","2026-04-28","2026-04-29","2026-04-30"
    ];

    const pkg5 = [
        "2026-05-04","2026-05-05","2026-05-06","2026-05-07","2026-05-08",
        "2026-05-11","2026-05-12","2026-05-13","2026-05-14","2026-05-15",
        "2026-05-18","2026-05-19","2026-05-20","2026-05-21","2026-05-22",
        "2026-05-25","2026-05-26","2026-05-27","2026-05-28","2026-05-29"
    ];

    const pkg6 = [
        "2026-06-04","2026-06-05",
        "2026-06-08","2026-06-09","2026-06-10","2026-06-11","2026-06-12",
        "2026-06-15","2026-06-16","2026-06-17","2026-06-18","2026-06-19",
        "2026-06-22","2026-06-23","2026-06-24","2026-06-25","2026-06-26",
        "2026-06-29","2026-06-30","2026-07-01"
    ];

    const pkg7 = [
        "2026-07-02","2026-07-03",
        "2026-07-06","2026-07-07","2026-07-08","2026-07-09","2026-07-10",
        "2026-07-13","2026-07-14","2026-07-15","2026-07-16","2026-07-17",
        "2026-07-20","2026-07-21","2026-07-22","2026-07-23","2026-07-24",
        "2026-07-27","2026-07-28","2026-07-29"
    ];

    // Рыжий Пакет 8 (10 августа – 4 сентября)
    const pkg8 = [
        "2026-08-10","2026-08-11","2026-08-12","2026-08-13","2026-08-14",
        "2026-08-17","2026-08-18","2026-08-19","2026-08-20","2026-08-21",
        "2026-08-24","2026-08-25","2026-08-26","2026-08-27","2026-08-28",
        "2026-08-31","2026-09-01","2026-09-02","2026-09-03","2026-09-04"
    ];

    // Пакет 9 (7 сентября – 2 октября)
    const pkg9 = [
        "2026-09-07","2026-09-08","2026-09-09","2026-09-10","2026-09-11",
        "2026-09-14","2026-09-15","2026-09-16","2026-09-17","2026-09-18",
        "2026-09-21","2026-09-22","2026-09-23","2026-09-24","2026-09-25",
        "2026-09-28","2026-09-29","2026-09-30","2026-10-01","2026-10-02"
    ];

    // Пакет 10 (5 октября – 30 октября, 8 занятий Пн/Чт)
    const pkg10 = [
        "2026-10-05","2026-10-06","2026-10-07","2026-10-08","2026-10-09",
        "2026-10-12","2026-10-13","2026-10-14","2026-10-15","2026-10-16",
        "2026-10-19","2026-10-20","2026-10-21","2026-10-22","2026-10-23",
        "2026-10-26","2026-10-27","2026-10-28","2026-10-29","2026-10-30"
    ];

    // ---------- ЗАНЯТИЯ ЛИЗЫ (понедельник + четверг) ----------
    const lessons = [
        // пакет 1
        "2026-01-12","2026-01-15","2026-01-19","2026-01-22","2026-01-26","2026-01-29","2026-02-02","2026-02-05",
        // пакет 2
        "2026-02-09","2026-02-12","2026-02-16","2026-02-19","2026-02-23","2026-02-26","2026-03-02","2026-03-05",
        // пакет 3
        "2026-03-09","2026-03-12","2026-03-16","2026-03-19","2026-03-23","2026-03-26","2026-03-30","2026-04-02",
        // пакет 4
        "2026-04-06","2026-04-09","2026-04-13","2026-04-16","2026-04-20","2026-04-23","2026-04-27","2026-04-30",
        // пакет 5
        "2026-05-04","2026-05-07","2026-05-11","2026-05-14","2026-05-18","2026-05-21","2026-05-25","2026-05-28",
        // пакет 6
        "2026-06-04","2026-06-08","2026-06-11","2026-06-15","2026-06-18","2026-06-22","2026-06-25","2026-06-29",
        // пакет 7
        "2026-07-02","2026-07-06","2026-07-09","2026-07-13","2026-07-16","2026-07-20","2026-07-23","2026-07-27",
        // пакет 8 (рыжий)
        "2026-08-10","2026-08-13","2026-08-17","2026-08-20","2026-08-24","2026-08-27","2026-08-31","2026-09-03",
        // пакет 9
        "2026-09-07","2026-09-10","2026-09-14","2026-09-17","2026-09-21","2026-09-24","2026-09-28","2026-10-01",
        // пакет 10 (Пн / Чт): 5 окт, 8 окт, 12 окт, 15 окт, 19 окт, 22 окт, 26 окт, 29 окт
        "2026-10-05","2026-10-08","2026-10-12","2026-10-15",
        "2026-10-19","2026-10-22","2026-10-26","2026-10-29"
    ];

    function getDaysInMonth(y,m) { return new Date(y, m+1, 0).getDate(); }
    function getStartOffset(y,m) { const d = new Date(y,m,1).getDay(); return d === 0 ? 6 : d-1; }
    function formatDate(y,m,d) { return `${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`; }

    function getCellClass(dateStr, y,m,d) {
        const in1 = pkg1.includes(dateStr);
        const in2 = pkg2.includes(dateStr);
        const in3 = pkg3.includes(dateStr);
        const in4 = pkg4.includes(dateStr);
        const in5 = pkg5.includes(dateStr);
        const in6 = pkg6.includes(dateStr);
        const in7 = pkg7.includes(dateStr);
        const in8 = pkg8.includes(dateStr);
        const in9 = pkg9.includes(dateStr);
        const in10 = pkg10.includes(dateStr);
        const isLesson = lessons.includes(dateStr);
        const isWeekend = (new Date(y,m,d).getDay() === 0 || new Date(y,m,d).getDay() === 6);

        let classes = [];

        if (in1) classes.push("p1");
        else if (in2) classes.push("p2");
        else if (in3) classes.push("p3");
        else if (in4) classes.push("p4");
        else if (in5) classes.push("p5");
        else if (in6) classes.push("p6");
        else if (in7) classes.push("p7");
        else if (in8) classes.push("p8");
        else if (in9) classes.push("p9");
        else if (in10) classes.push("p10");
        else if (isWeekend) classes.push("weekend");

        if (isLesson) classes.push("lesson-badge");

        return classes.join(" ");
    }

    function render() {
        const container = document.getElementById("calendarGrid");
        container.innerHTML = "";

        for (let m = 0; m < 12; m++) {
            const daysInMonth = getDaysInMonth(year, m);
            const startOffset = getStartOffset(year, m);
            const totalCells = Math.ceil((startOffset + daysInMonth) / 7) * 7;

            let html = `<div class="month-card">
                        <div class="month-title">${months[m]} ${year}</div>
                        <table class="calendar-table">
                            <thead>
                                <tr>`;
            for (let w of weekDays) {
                const isW = (w === "Сб" || w === "Вс");
                html += `<th class="${isW ? 'weekend-header' : ''}">${w}</th>`;
            }
            html += `</tr>
                            </thead>
                            <tbody>`;

            let day = 1;
            for (let i = 0; i < totalCells; i++) {
                if (i % 7 === 0) html += "<tr>";
                if (i >= startOffset && day <= daysInMonth) {
                    const dateStr = formatDate(year, m, day);
                    const cls = getCellClass(dateStr, year, m, day);
                    html += `<td class="${cls}">${day}</td>`;
                    day++;
                } else {
                    const prevMonth = m === 0 ? 11 : m-1;
                    const prevYear = m === 0 ? year-1 : year;
                    const prevMonthDays = getDaysInMonth(prevYear, prevMonth);
                    let prevDay = prevMonthDays - (startOffset - i - 1);
                    if (prevDay <= 0) {
                        const prevPrevMonth = prevMonth === 0 ? 11 : prevMonth-1;
                        const prevPrevYear = prevMonth === 0 ? year-1 : prevYear;
                        const prevPrevMonthDays = getDaysInMonth(prevPrevYear, prevPrevMonth);
                        prevDay = prevPrevMonthDays + prevDay;
                    }
                    html += `<td class="other-month">${prevDay}</td>`;
                }
                if (i % 7 === 6) html += "</tr>";
            }
            html += `</tbody></table></div>`;
            container.innerHTML += html;
        }
    }

    render();
</script>
</body>
</html>
